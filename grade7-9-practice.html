<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>七至九年级全科刷题</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #40364a;
      background:
        radial-gradient(circle at 10% 8%, rgba(255, 143, 199, .28), transparent 30%),
        radial-gradient(circle at 92% 10%, rgba(143, 229, 200, .26), transparent 30%),
        linear-gradient(135deg, #fff7fb, #f6fbff 52%, #fff9e7);
    }
    button, select, input { font: inherit; }
    button { cursor: pointer; border: 0; }
    .app { width: min(1120px, calc(100% - 24px)); margin: 0 auto; padding: 18px 0 28px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { margin: 0 0 4px; font-size: clamp(28px, 5vw, 42px); letter-spacing: 0; }
    h2 { margin: 0 0 10px; font-size: 22px; }
    p { margin-top: 0; }
    .muted { color: #74687d; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab, .btn {
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255,255,255,.78);
      color: #40364a;
      border: 1px solid rgba(111, 76, 130, .16);
      box-shadow: 0 8px 18px rgba(130, 98, 145, .1);
    }
    .tab.active, .btn.primary { color: #fff; font-weight: 800; background: #e985bf; border-color: transparent; }
    .btn.mint { background: #9fe2c4; color: #274b40; font-weight: 800; }
    .btn.warn { color: #9c3c55; background: #fff1f4; border-color: #ffc4d2; }
    .grid { display: grid; gap: 14px; }
    .layout { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 14px; align-items: start; }
    .panel {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(111, 76, 130, .14);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 18px 45px rgba(168, 113, 170, .14);
    }
    .subjects, .topics, .stats, .options, .answer-card { display: grid; gap: 8px; }
    .subjects { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .subject, .topic, .option {
      width: 100%;
      text-align: left;
      padding: 12px;
      border-radius: 8px;
      color: #40364a;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(111, 76, 130, .16);
    }
    .subject.active, .topic.selected, .option.chosen { outline: 3px solid rgba(233, 133, 191, .35); background: #fff2f8; }
    .topic small { display: block; color: #74687d; margin-top: 4px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .stats { grid-template-columns: repeat(4, 1fr); }
    .stat { padding: 12px; border-radius: 8px; background: rgba(255,255,255,.68); border: 1px solid rgba(111, 76, 130, .14); }
    .stat small { display: block; color: #74687d; }
    .stat strong { font-size: 24px; }
    .field { display: grid; gap: 5px; }
    select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(111, 76, 130, .2); background: #fff; color: #40364a; }
    .hidden { display: none !important; }
    .question { padding: 16px; border-radius: 8px; background: rgba(255,255,255,.7); border: 1px solid rgba(111, 76, 130, .14); }
    .q-title { font-size: 21px; line-height: 1.45; font-weight: 800; margin: 12px 0; }
    .badge {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(111, 76, 130, .14);
      color: #74687d;
      font-size: 13px;
      font-weight: 700;
    }
    .answer-card { grid-template-columns: repeat(8, 1fr); margin-top: 12px; }
    .dot {
      min-height: 34px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid rgba(111, 76, 130, .16);
      color: #40364a;
      font-weight: 800;
    }
    .dot.done { background: #dcf8ef; }
    .dot.now { outline: 3px solid rgba(233, 133, 191, .35); }
    .dot.right { background: #dff8ef; color: #23795e; }
    .dot.wrong { background: #ffe0e7; color: #9c3c55; }
    .analysis { margin-top: 12px; padding: 12px; border-radius: 8px; background: #fff7cf; border: 1px solid rgba(226,169,44,.28); }
    .mistake { padding: 12px; border-radius: 8px; background: rgba(255,255,255,.7); border: 1px solid rgba(111,76,130,.14); }
    .toast {
      position: fixed;
      right: 14px;
      bottom: 14px;
      max-width: 360px;
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid rgba(111,76,130,.14);
      box-shadow: 0 18px 45px rgba(168,113,170,.18);
    }
    .toast.show { display: block; }
    @media (max-width: 800px) {
      .top, .layout { grid-template-columns: 1fr; display: grid; }
      .subjects, .stats { grid-template-columns: repeat(2, 1fr); }
      .answer-card { grid-template-columns: repeat(6, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <h1>七至九年级全科刷题</h1>
        <div class="muted">中考真题风格 + 模拟题风格，离线可用，不重复组卷</div>
      </div>
      <nav class="tabs">
        <button class="tab active" data-view="build">组卷</button>
        <button class="tab" data-view="exam">答题</button>
        <button class="tab" data-view="mistakes">错题</button>
        <button class="tab" data-view="me">记录</button>
      </nav>
    </header>

    <main class="layout">
      <aside class="panel">
        <h2>科目</h2>
        <div class="subjects" id="subjects"></div>
        <h2 style="margin-top:16px;">知识点</h2>
        <div class="topics" id="topics"></div>
      </aside>

      <section class="panel">
        <div id="buildView">
          <h2>生成试卷</h2>
          <div class="grid">
            <div class="stats">
              <div class="stat"><small>已选知识点</small><strong id="selectedCount">0</strong></div>
              <div class="stat"><small>本次题量</small><strong id="paperSize">26</strong></div>
              <div class="stat"><small>错题</small><strong id="wrongCount">0</strong></div>
              <div class="stat"><small>完成卷数</small><strong id="doneCount">0</strong></div>
            </div>
            <div class="row">
              <div class="field" style="min-width:180px;">
                <label>难度</label>
                <select id="difficulty">
                  <option value="easy">基础</option>
                  <option value="medium">提升</option>
                  <option value="hard">压轴</option>
                </select>
              </div>
              <div class="field" style="min-width:180px;">
                <label>题型来源</label>
                <select id="sourceMode">
                  <option value="mix">真题风格 + 模拟题</option>
                  <option value="real">优先真题风格</option>
                  <option value="mock">优先模拟题</option>
                </select>
              </div>
            </div>
            <div class="row">
              <button class="btn mint" id="selectSubjectBtn">全选当前科目</button>
              <button class="btn" id="clearBtn">清空选择</button>
              <button class="btn primary" id="buildBtn">生成不重复试卷</button>
            </div>
            <p class="muted">如果只选一个知识点，也会从不同题组里抽题；如果题量不足，会自动减少题数，不会用同一道题凑数。</p>
          </div>
        </div>

        <div id="examView" class="hidden">
          <div class="row" style="justify-content:space-between;">
            <div>
              <h2 id="examTitle">还没有试卷</h2>
              <div class="row" id="examMeta"></div>
            </div>
            <div class="row">
              <button class="btn" id="prevBtn">上一题</button>
              <button class="btn mint" id="nextBtn">下一题</button>
              <button class="btn primary" id="submitBtn">交卷</button>
            </div>
          </div>
          <div id="questionBox"></div>
          <div class="answer-card" id="answerCard"></div>
        </div>

        <div id="mistakesView" class="hidden">
          <h2>错题本</h2>
          <div class="row" style="margin-bottom:10px;">
            <button class="btn warn" id="clearMistakesBtn">清空错题</button>
          </div>
          <div class="grid" id="mistakeList"></div>
        </div>

        <div id="meView" class="hidden">
          <h2>学习记录</h2>
          <div class="stats">
            <div class="stat"><small>完成卷数</small><strong id="meDone">0</strong></div>
            <div class="stat"><small>最高分</small><strong id="meBest">0</strong></div>
            <div class="stat"><small>平均分</small><strong id="meAvg">0</strong></div>
            <div class="stat"><small>错题数</small><strong id="meWrong">0</strong></div>
          </div>
          <div class="row" style="margin-top:14px;">
            <button class="btn" id="exportBtn">导出记录</button>
            <button class="btn" id="importBtn">导入记录</button>
            <input class="hidden" id="importFile" type="file" accept=".json">
            <button class="btn warn" id="resetBtn">重置记录</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORE = "haohao_grade_7_9_clean_v1";
    const SUBJECTS = ["语文", "数学", "英语", "物理", "化学", "历史", "道法"];
    const TOPICS = {
      "语文": ["现代文阅读", "文言文实词", "古诗鉴赏", "说明文阅读", "议论文阅读", "作文审题"],
      "数学": ["一次函数", "二次函数", "全等三角形", "相似三角形", "勾股定理", "圆", "统计概率", "方程与不等式"],
      "英语": ["阅读理解", "完形填空", "现在完成时", "宾语从句", "情景交际", "短文填空", "书面表达"],
      "物理": ["机械运动", "声现象", "光现象", "力与运动", "压强浮力", "电路基础", "欧姆定律"],
      "化学": ["物质变化", "空气与氧气", "水和溶液", "化学方程式", "酸碱盐", "金属活动性", "实验探究"],
      "历史": ["中国古代史", "中国近代史", "新民主主义革命", "世界近代史", "工业革命", "两次世界大战"],
      "道法": ["社会规则", "网络生活", "责任担当", "宪法意识", "权利义务", "国家利益", "中国发展"]
    };
    const DIFF_NAME = { easy: "基础", medium: "提升", hard: "压轴" };
    const state = loadState();
    let currentSubject = state.currentSubject || "数学";
    let selected = new Set(state.selected || []);
    let paper = state.paper || null;
    let qIndex = state.qIndex || 0;

    function loadState() {
      try { return { ...defaults(), ...JSON.parse(localStorage.getItem(STORE) || "{}") }; }
      catch { return defaults(); }
    }
    function defaults() {
      return { selected: [], currentSubject: "数学", mistakes: [], history: [], paper: null, qIndex: 0 };
    }
    function save() {
      state.selected = [...selected];
      state.currentSubject = currentSubject;
      state.paper = paper;
      state.qIndex = qIndex;
      localStorage.setItem(STORE, JSON.stringify(state));
    }
    const $ = id => document.getElementById(id);

    function buildBank() {
      const bank = [];
      SUBJECTS.forEach(subject => TOPICS[subject].forEach(topic => {
        ["easy", "medium", "hard"].forEach(diff => {
          for (let n = 1; n <= 40; n++) bank.push(makeQuestion(subject, topic, diff, n));
        });
      }));
      return bank;
    }

    function makeQuestion(subject, topic, diff, n) {
      const source = n % 2 ? "历年真题风格" : "中考模拟题";
      const type = "单选";
      const score = diff === "easy" ? 3 : diff === "medium" ? 4 : 5;
      const base = { id: `${subject}-${topic}-${diff}-${n}`, subject, topic, diff, source, type, score };
      const pick = n % 8;
      const makers = {
        "语文": () => chineseQuestion(topic, source, n, pick),
        "数学": () => mathQuestion(topic, source, n, diff, pick),
        "英语": () => englishQuestion(topic, source, n, pick),
        "物理": () => physicsQuestion(topic, source, n, diff, pick),
        "化学": () => chemistryQuestion(topic, source, n, pick),
        "历史": () => historyQuestion(topic, source, n, pick),
        "道法": () => politicsQuestion(topic, source, n, pick)
      };
      return { ...base, ...finalizeQuestion(makers[subject]()) };
    }

    function finalizeQuestion(q) {
      const options = [];
      q.options.forEach(option => {
        if (!options.includes(option)) options.push(option);
      });
      const fallback = ["无法由材料推出", "与题干条件不符", "只符合部分条件", "表述过于绝对"];
      fallback.forEach(option => {
        if (options.length < 4 && !options.includes(option)) options.push(option);
      });
      return { ...q, options: options.slice(0, 4), answer: [q.answer[0]] };
    }

    function chineseQuestion(topic, source, n, pick) {
      const passages = [
        {
          title: "巷口的灯",
          text: "晚自习后，巷口那盏旧路灯总比别处亮得早。阿婆搬着小凳坐在灯下，手里一针一线地缝着校服袖口。她看见我低着头走来，便把凳子往旁边挪了挪，说：'慢点，地上有水。'我这才发现，白天漏水的水管在青石板上铺了一层薄亮。灯光照着那片水，像给回家的路铺了一层安静的银。后来我才知道，阿婆每天傍晚都会把灯旁的杂物收开，只为让孩子们看清脚下。",
          word: "薄亮",
          sentence: "灯光照着那片水，像给回家的路铺了一层安静的银。",
          detail: "阿婆每天傍晚都会把灯旁的杂物收开",
          emotion: "温暖、感激"
        },
        {
          title: "一碗热汤",
          text: "雨下得急，公交站牌前挤满了人。我把书包抱在胸前，试图挡住被风吹斜的雨。小店老板从门口探出头，冲我们喊：'进来躲躲吧，汤还热着。'店里不大，几张桌子很快坐满。老板没有催人点单，只把一锅萝卜汤端到门边，给每个淋湿的人盛半碗。汤很淡，却让人从指尖暖到心口。雨停时，门口的伞被人一把把递出去，谁也没有拿错。",
          word: "探出头",
          sentence: "汤很淡，却让人从指尖暖到心口。",
          detail: "老板没有催人点单，只给淋湿的人盛汤",
          emotion: "善意、温情"
        },
        {
          title: "父亲的修车摊",
          text: "父亲的修车摊在菜市场拐角，铁盒里总放着几枚磨亮的螺丝。有人来补胎，他弯下腰，先用手摸一遍轮胎，再把细小的玻璃渣挑出来。夏天的柏油路烫得发软，他的汗顺着下巴滴到地上。可每次收钱，他总把零头抹去，说：'车好骑就行。'我曾嫌他的摊位不起眼，直到有一天，看见一个老人推着车来，远远就喊：'老地方，还找你。'",
          word: "磨亮",
          sentence: "我曾嫌他的摊位不起眼，直到有一天，看见一个老人推着车来，远远就喊：'老地方，还找你。'",
          detail: "父亲先摸轮胎，再挑玻璃渣",
          emotion: "理解、敬佩"
        },
        {
          title: "图书馆的便签",
          text: "学校图书馆靠窗的位置，总贴着一张浅黄色便签：'读到这里，别忘了抬头看看树。'起初我以为是谁随手写的玩笑。期末复习那几天，我被一道题卡住，越想越烦，抬头时正看见窗外香樟树的新叶在风里翻动。那些叶子并不急着长大，只是一片一片舒展开。我忽然明白，便签不是让人分心，而是提醒我们在紧张里留一点呼吸。",
          word: "舒展",
          sentence: "便签不是让人分心，而是提醒我们在紧张里留一点呼吸。",
          detail: "便签提醒读者抬头看看树",
          emotion: "释然、从容"
        }
      ];
      const passage = passages[n % passages.length];
      const stemType = pick % 6;
      const header = `【${source}·${topic}】阅读下面文字，完成题目。\n《${passage.title}》\n${passage.text}\n\n`;
      const questions = [
        {
          prompt: `${header}结合语境，文中加点词“${passage.word}”最恰当的理解是？（题组${n}）`,
          options: ["写出了具体情境中的状态，也暗含人物感受", "主要说明时间推移很快", "强调人物说话声音很低", "突出事件发生地点偏僻"],
          answer: ["写出了具体情境中的状态，也暗含人物感受"],
          explain: "词语理解题要放回上下文，看它写出了什么特点，并联系人物情感或文章主旨。"
        },
        {
          prompt: `${header}请判断画线句“${passage.sentence}”的表达作用，最恰当的一项是？（题组${n}）`,
          options: ["运用描写或修辞，表现环境特点，并烘托人物情感", "直接交代故事发生的准确时间", "主要说明人物外貌发生变化", "突出情节发展出现激烈冲突"],
          answer: ["运用描写或修辞，表现环境特点，并烘托人物情感"],
          explain: "句子赏析题通常从修辞、描写、关键词入手，再答出内容效果和情感作用。"
        },
        {
          prompt: `${header}下列对文中细节“${passage.detail}”的理解，最符合文意的是？（题组${n}）`,
          options: ["体现人物细心、善良或负责，推动读者理解主题", "说明人物做事拖拉，影响情节推进", "表现人物急于得到他人称赞", "暗示人物对眼前工作十分厌烦"],
          answer: ["体现人物细心、善良或负责，推动读者理解主题"],
          explain: "细节描写往往服务于人物形象和主题表达，不能只看表面动作。"
        },
        {
          prompt: `${header}文章主要表达的情感最接近哪一项？（题组${n}）`,
          options: [passage.emotion, "厌烦、疏离", "恐惧、压抑", "得意、炫耀"],
          answer: [passage.emotion],
          explain: "概括情感要抓人物行为、叙述语气和结尾处的转折或点题句。"
        },
        {
          prompt: `${header}如果把文章标题换成“普通的一天”，下列评价最合理的是？（题组${n}）`,
          options: ["不如原题具体，原题更能提示关键意象和主题", "更好，因为新标题能概括所有细节", "两个标题都只交代时间，表达效果相同", "原题削弱了文章悬念，不宜使用"],
          answer: ["不如原题具体，原题更能提示关键意象和主题"],
          explain: "标题作用题可从线索、对象、悬念、情感和主题提示等角度分析。"
        },
        {
          prompt: `${header}阅读全文，下列对文章内容和主题的理解最恰当的一项是？（题组${n}）`,
          options: ["文章通过具体生活细节，表现普通人之间的善意与温情", "文章主要表现公共秩序混乱带来的后果", "文章重点介绍自然景物变化的科学原因", "文章意在突出主人公学习成绩的提高"],
          answer: ["文章通过具体生活细节，表现普通人之间的善意与温情"],
          explain: "内容理解题要概括主要事件，并联系人物行为和结尾语句把握主题。"
        }
      ];
      return questions[stemType];
    }

    function mathQuestion(topic, source, n, diff, pick) {
      const a = n + 2;
      const b = pick + (diff === "hard" ? 6 : diff === "medium" ? 4 : 2);
      const qid = `（题组${n}）`;
      if (topic.includes("二次函数")) {
        const h = pick % 5 + 1;
        const k = diff === "hard" ? -b : b;
        return {
          prompt: `【${source}】如图象信息所示，抛物线 y=(x-${h})²${k >= 0 ? "+" : ""}${k} 的顶点坐标是？${qid}`,
          options: [`(${h},${k})`, `(${-h},${k})`, `(${h},${-k})`, `(${k},${h})`],
          answer: [`(${h},${k})`],
          explain: "y=(x-h)²+k 的顶点坐标是 (h,k)。"
        };
      }
      if (topic.includes("一次函数") || topic.includes("函数")) {
        const x1 = 2;
        const y1 = a * x1 + b;
        const x2 = 5;
        const y2 = a * x2 + b;

    function uniqueNumbers(values) {
      const out = [];
      values.forEach(value => {
        const n = Number(value);
        if (Number.isFinite(n) && !out.includes(n)) out.push(n);
      });
      let next = 1;
      while (out.length < 4) {
        if (!out.includes(next)) out.push(next);
        next++;
      }
      return out;
    }

            answer: "萨拉热窝事件",
            explain: "萨拉热窝事件是第一次世界大战爆发的导火索。"
          },
          {
            material: "材料：1942年，中、美、英、苏等国签署宣言，逐步形成世界反法西斯同盟。",
            ask: "这一同盟形成的主要作用是？",
            options: ["加强反法西斯国家协同作战", "加速法西斯势力扩张", "结束第一次世界大战", "建立凡尔赛体系"],
            answer: "加强反法西斯国家协同作战",
            explain: "世界反法西斯同盟推动各国协同作战，是战争胜利的重要保障。"
          }
        ]
      };
      const cases = byTopic[topic] || byTopic["中国近代史"];
      const item = cases[(n + pick) % cases.length];
      return {
        prompt: `【${source}·${topic}】阅读材料，回答问题。\n${item.material}\n${item.ask}（题组${n}）`,
        options: item.options,
        answer: [item.answer],
        explain: item.explain
      };
    }

    function politicsQuestion(topic, source, n, pick) {
      const cases = [
        {
          material: "情境：小林在班级群里看到一条未经证实的“学校停课”消息，很多同学准备转发。",
          ask: "小林的正确做法是？",
          options: ["先核实来源，不信谣不传谣", "马上转发给所有人", "编造更多细节提醒大家", "只要好玩就可以传播"],
          answer: "先核实来源，不信谣不传谣",
          explain: "网络生活要理性参与，遵守法律和道德，传播信息前应核实。"
        },
        {
          material: "情境：小区图书角写着“每次借书请登记，读完及时归还”。有人认为这是限制自由。",
          ask: "对此理解正确的是？",
          options: ["规则划定自由边界，也保障大家的阅读自由", "有规则就没有自由", "自由就是想拿多久就拿多久", "规则只约束别人"],
          answer: "规则划定自由边界，也保障大家的阅读自由",
          explain: "社会规则不是取消自由，而是保障有序生活中的自由。"
        },
        {
          material: "情境：学校组织国家安全主题活动，同学们讨论青少年能为国家安全做什么。",
          ask: "下列做法最恰当的是？",
          options: ["增强国家安全意识，发现危害行为及时报告", "认为国家安全与学生无关", "随意拍摄涉密场所并上传", "只在考试前背概念"],
          answer: "增强国家安全意识，发现危害行为及时报告",
          explain: "维护国家安全是公民义务，青少年也应从实际行动做起。"
        },
        {
          material: "情境：小周在网上购买文具后发现商家发错货，与商家沟通无果。",
          ask: "小周维护权利的合理路径是？",
          options: ["保存证据，依法协商、投诉或寻求平台帮助", "辱骂商家并泄露其个人信息", "自认倒霉，不再处理", "找同学一起恶意刷差评"],
          answer: "保存证据，依法协商、投诉或寻求平台帮助",
          explain: "维权要依法、有序、理性，注意保存证据。"
        },
        {
          material: "情境：班级值日时，有同学只想享受干净环境，却不愿参加劳动。",
          ask: "从权利与义务关系看，正确认识是？",
          options: ["享有权利的同时也应履行相应义务", "权利和义务完全无关", "只享受权利不用承担义务", "义务只属于班干部"],
          answer: "享有权利的同时也应履行相应义务",
          explain: "公民的权利和义务相统一，集体生活中也要承担责任。"
        },
        {
          material: "情境：某地推进垃圾分类，有居民觉得麻烦，随意投放。",
          ask: "从生态文明角度看，正确做法是？",
          options: ["自觉分类投放，践行绿色生活方式", "只要没人看见就随便扔", "环保只是政府的事", "把垃圾放到别人门口"],
          answer: "自觉分类投放，践行绿色生活方式",
          explain: "建设生态文明需要每个人落实绿色、低碳、文明的生活方式。"
        }
      ];
      const item = cases[(n + pick) % cases.length];
      return {
        prompt: `【${source}·${topic}】阅读情境，回答问题。\n${item.material}\n${item.ask}（题组${n}）`,
        options: item.options,
        answer: [item.answer],
        explain: item.explain
      };
    }

    const bank = buildBank();

    function renderAll() {
      renderSubjects();
      renderTopics();
      renderStats();
      renderQuestion();
      renderMistakes();
      renderMe();
    }
    function renderSubjects() {
      $("subjects").innerHTML = SUBJECTS.map(s => `<button class="subject ${s === currentSubject ? "active" : ""}" data-sub="${s}">${s}</button>`).join("");
      document.querySelectorAll("[data-sub]").forEach(btn => btn.onclick = () => { currentSubject = btn.dataset.sub; save(); renderAll(); });
    }
    function renderTopics() {
      $("topics").innerHTML = TOPICS[currentSubject].map(t => {
        const id = `${currentSubject}|${t}`;
        return `<button class="topic ${selected.has(id) ? "selected" : ""}" data-topic="${id}"><b>${t}</b><small>${currentSubject} · 中考考点</small></button>`;
      }).join("");
      document.querySelectorAll("[data-topic]").forEach(btn => btn.onclick = () => {
        selected.has(btn.dataset.topic) ? selected.delete(btn.dataset.topic) : selected.add(btn.dataset.topic);
        save();
        renderAll();
      });
    }
    function renderStats() {
      $("selectedCount").textContent = selected.size;
      $("wrongCount").textContent = state.mistakes.length;
      $("doneCount").textContent = state.history.length;
      $("paperSize").textContent = paper ? paper.questions.length : 26;
    }
    function showView(name) {
      ["build", "exam", "mistakes", "me"].forEach(v => {
        $(`${v}View`).classList.toggle("hidden", v !== name);
        document.querySelector(`[data-view="${v}"]`).classList.toggle("active", v === name);
      });
      renderAll();
    }

    function buildPaper() {
      const selectedTopics = [...selected];
      if (!selectedTopics.length) return toast("请先选择至少一个知识点。");
      const diff = $("difficulty").value;
      const mode = $("sourceMode").value;
      let pool = bank.filter(q => selectedTopics.includes(`${q.subject}|${q.topic}`) && q.diff === diff);
      if (mode === "real") pool = [...pool.filter(q => q.source === "历年真题风格"), ...pool.filter(q => q.source !== "历年真题风格")];
      if (mode === "mock") pool = [...pool.filter(q => q.source === "中考模拟题"), ...pool.filter(q => q.source !== "中考模拟题")];
      pool = shuffle(pool);

      const used = new Set();
      const questions = [];
      for (const item of pool) {
        const key = normalize(item.prompt);
        if (used.has(key)) continue;
        used.add(key);
        questions.push({ ...item, uid: `${item.id}-${questions.length}` });
        if (questions.length >= 26) break;
      }
      if (!questions.length) return toast("当前选择没有可用题，请换一个难度或多选知识点。");

      normalizeScores(questions);
      paper = { created: Date.now(), diff, mode, questions, answers: {}, result: null };
      qIndex = 0;
      save();
      showView("exam");
      toast(`已生成 ${questions.length} 道不重复题。`);
    }
    function normalizeScores(questions) {
      const total = questions.reduce((sum, q) => sum + q.score, 0);
      questions.forEach(q => q.score = Math.max(1, Math.round(q.score * 100 / total)));
      questions[0].score += 100 - questions.reduce((sum, q) => sum + q.score, 0);
    }
    function renderQuestion() {
      if (!paper) {
        $("examTitle").textContent = "还没有试卷";
        $("examMeta").innerHTML = "";
        $("questionBox").innerHTML = "<p class='muted'>请先去组卷页面生成试卷。</p>";
        $("answerCard").innerHTML = "";
        return;
      }
      const q = paper.questions[qIndex];
      const chosen = paper.answers[q.uid] || [];
      $("examTitle").textContent = `${q.subject} · ${q.topic}`;
      $("examMeta").innerHTML = `<span class="badge">${qIndex + 1}/${paper.questions.length}</span><span class="badge">${DIFF_NAME[q.diff]}</span><span class="badge">${q.source}</span><span class="badge">${q.score}分</span>`;
      $("questionBox").innerHTML = `
        <div class="question">
          <div class="q-title">${qIndex + 1}. ${escapeHtml(q.prompt)}</div>
          <div class="options">
            ${q.options.map((opt, i) => `<label class="option ${chosen.includes(opt) ? "chosen" : ""}">
              <input type="${q.type === "多选" ? "checkbox" : "radio"}" name="answer" value="${escapeHtml(opt)}" ${chosen.includes(opt) ? "checked" : ""}>
              <b>${String.fromCharCode(65 + i)}.</b> ${escapeHtml(opt)}
            </label>`).join("")}
          </div>
          ${paper.result ? renderAnalysis(q) : ""}
        </div>`;
      document.querySelectorAll(".option").forEach(label => label.onclick = () => setTimeout(collectAnswer, 0));
      renderAnswerCard();
    }
    function renderAnalysis(q) {
      const item = paper.result.items.find(x => x.uid === q.uid);
      return `<div class="analysis"><b>${item.correct ? "正确" : "错误"}</b><br>答案：${q.answer.join("、")}<br>${q.explain}</div>`;
    }
    function collectAnswer() {
      const q = paper.questions[qIndex];
      paper.answers[q.uid] = [...document.querySelectorAll("input[name='answer']:checked")].map(x => x.value);
      save();
      renderQuestion();
    }
    function renderAnswerCard() {
      if (!paper) return;
      $("answerCard").innerHTML = paper.questions.map((q, i) => {
        const ans = paper.answers[q.uid];
        const res = paper.result && paper.result.items.find(x => x.uid === q.uid);
        const cls = `${ans && ans.length ? "done" : ""} ${i === qIndex ? "now" : ""} ${res ? (res.correct ? "right" : "wrong") : ""}`;
        return `<button class="dot ${cls}" data-jump="${i}">${i + 1}</button>`;
      }).join("");
      document.querySelectorAll("[data-jump]").forEach(btn => btn.onclick = () => { qIndex = Number(btn.dataset.jump); save(); renderQuestion(); });
    }
    function submitPaper() {
      if (!paper || paper.result) return;
      const items = paper.questions.map(q => {
        const ans = (paper.answers[q.uid] || []).slice().sort();
        const right = q.answer.slice().sort();
        return { uid: q.uid, correct: JSON.stringify(ans) === JSON.stringify(right), score: JSON.stringify(ans) === JSON.stringify(right) ? q.score : 0 };
      });
      const score = items.reduce((sum, item) => sum + item.score, 0);
      paper.result = { score, items, at: Date.now() };
      paper.questions.forEach(q => {
        const item = items.find(x => x.uid === q.uid);
        if (!item.correct) addMistake(q);
      });
      state.history.unshift({ score, at: Date.now(), count: paper.questions.length });
      save();
      renderAll();
      toast(`已交卷，得分 ${score} 分。`);
    }
    function addMistake(q) {
      const key = normalize(q.prompt);
      const old = state.mistakes.find(m => m.key === key);
      if (old) old.count += 1;
      else state.mistakes.push({ key, subject: q.subject, topic: q.topic, prompt: q.prompt, answer: q.answer, explain: q.explain, count: 1 });
    }
    function renderMistakes() {
      $("mistakeList").innerHTML = state.mistakes.map(m => `<div class="mistake">
        <div class="row"><span class="badge">${m.subject}</span><span class="badge">${m.topic}</span><span class="badge">错${m.count}次</span></div>
        <p><b>${escapeHtml(m.prompt)}</b></p>
        <p>答案：${m.answer.join("、")}</p>
        <p class="muted">${m.explain}</p>
      </div>`).join("") || "<p class='muted'>暂无错题。</p>";
    }
    function renderMe() {
      const scores = state.history.map(h => h.score);
      $("meDone").textContent = state.history.length;
      $("meBest").textContent = scores.length ? Math.max(...scores) : 0;
      $("meAvg").textContent = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
      $("meWrong").textContent = state.mistakes.length;
    }
    function shuffle(arr) {
      const out = arr.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    }
    function normalize(text) {
      return String(text || "").replace(/\s+/g, "").toLowerCase();
    }
    function escapeHtml(text) {
      return String(text ?? "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
    }
    function toast(text) {
      $("toast").textContent = text;
      $("toast").classList.add("show");
      setTimeout(() => $("toast").classList.remove("show"), 2300);
    }

    document.querySelectorAll("[data-view]").forEach(btn => btn.onclick = () => showView(btn.dataset.view));
    $("selectSubjectBtn").onclick = () => { TOPICS[currentSubject].forEach(t => selected.add(`${currentSubject}|${t}`)); save(); renderAll(); };
    $("clearBtn").onclick = () => { selected.clear(); save(); renderAll(); };
    $("buildBtn").onclick = buildPaper;
    $("prevBtn").onclick = () => { if (!paper) return; qIndex = Math.max(0, qIndex - 1); save(); renderQuestion(); };
    $("nextBtn").onclick = () => { if (!paper) return; qIndex = Math.min(paper.questions.length - 1, qIndex + 1); save(); renderQuestion(); };
    $("submitBtn").onclick = submitPaper;
    $("clearMistakesBtn").onclick = () => { if (confirm("确定清空错题吗？")) { state.mistakes = []; save(); renderAll(); } };
    $("exportBtn").onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
      a.download = "haohao-practice-record.json";
      a.click();
      URL.revokeObjectURL(a.href);
    };
    $("importBtn").onclick = () => $("importFile").click();
    $("importFile").onchange = event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          Object.assign(state, defaults(), data);
          selected = new Set(state.selected || []);
          currentSubject = state.currentSubject || "数学";
          paper = state.paper || null;
          qIndex = state.qIndex || 0;
          save();
          renderAll();
          toast("记录已导入。");
        } catch {
          toast("导入失败，请选择正确的 JSON 文件。");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    };
    $("resetBtn").onclick = () => {
      if (!confirm("确定重置全部记录吗？")) return;
      Object.assign(state, defaults());
      selected = new Set();
      currentSubject = "数学";
      paper = null;
      qIndex = 0;
      save();
      renderAll();
      showView("build");
    };

    renderAll();
  </script>
</body>
</html>
