      const chosenTopics = [...selected].map(topicById);
      const questions = [];
      const prevMistakes = state.mistakes.slice().sort((a,b)=>b.count-a.count).slice(0,5);
      prevMistakes.forEach(m => {
        const source = bank.find(q => q.topicId === m.topicId && q.type === m.type) || bank.find(q => q.topicId === m.topicId);
        if (source) questions.push({ ...source, uid: "v-" + source.id + "-" + questions.length, prompt: "銆愰敊棰樺彉寮忋€? + source.prompt, source: "閿欓鍚岀被鍙樺紡" });
      });
      let pool = bank.filter(q => selected.has(q.topicId) && q.diff === diff);
      if (mode === "real") pool = pool.filter(q => q.source.includes("鐪熼")).concat(pool);
      let i = 0;
      while (questions.length < 26 && pool.length) {
        const item = pool[i % pool.length];
        questions.push({ ...item, uid: item.id + "-" + questions.length });
        i++;
      }
      let total = questions.reduce((s,q)=>s+q.score,0);
      questions.forEach(q => q.score = Math.max(1, Math.round(q.score * 100 / total)));
      const delta = 100 - questions.reduce((s,q)=>s+q.score,0);
      questions[0].score += delta;
      paper = { created: Date.now(), diff, mode, timeMode: $("timeMode").value, topics: chosenTopics.map(t=>t.id), questions, answers: {}, marks: {}, result: null, total: 100, start: Date.now(), seconds: timeLimit($("timeMode").value), focusEvents: [] };
      qIndex = 0; save(); showTab("exam"); startTimer(); renderQuestion(); toast("璇曞嵎宸茬敓鎴愶紝绛旀浼氬疄鏃朵繚瀛樸€?);
      enterFocusGuard();
    }
    function timeLimit(mode) { return mode === "standard" ? 7200 : mode === "limit" ? 1800 : 0; }
    function startTimer() {
      clearInterval(timerId);
      timerId = setInterval(() => {
        if (!paper) return;
        if (!paper.seconds) { $("timer").textContent = "鑷敱缁冧範"; return; }
        const used = Math.floor((Date.now() - paper.start) / 1000);
        const left = Math.max(0, paper.seconds - used);
        $("timer").textContent = `${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`;
        if (left <= 0 && !paper.result) submitPaper();
      }, 500);
    }
    function submitPaper() {
      if (!paper || paper.result) return;
      if (!confirm("纭畾浜ゅ嵎鍚楋紵浜ゅ嵎鍚庝細绔嬪嵆鎵规敼銆?)) return;
      const items = paper.questions.map(q => {
        const ans = (paper.answers[q.uid] || []).slice().sort();
        const right = q.answer.slice().sort();
        const correct = JSON.stringify(ans) === JSON.stringify(right);
        return { uid: q.uid, correct, score: correct ? q.score : 0 };
      });
      const score = items.reduce((s,x)=>s+x.score,0);
      paper.result = { score, items, at: Date.now() };
      const wrongs = paper.questions.filter(q => !items.find(x=>x.uid===q.uid).correct);
      wrongs.forEach(addMistake);
      const allWrongVariantsRight = !paper.questions.some(q => q.source === "閿欓鍚岀被鍙樺紡" && !items.find(x=>x.uid===q.uid).correct);
      const pass = score >= 90 && allWrongVariantsRight;
      if (pass) passTopics(); else failPetal();
      state.history.unshift({ date: today(), score, diff: paper.diff, count: paper.questions.length, pass, focusEvents: paper.focusEvents?.length || 0 });
      save(); renderAll(); renderQuestion(); showResult(score, pass);
      exitFocusGuard();
    }
    function passTopics() {
      paper.topics.forEach(id => {
        const st = getTopic(id);
        state.stars += diffStar[paper.diff];
        if (paper.diff === "hard") { st.lit = true; unlockDependents(id); flower(); }
        else st[nextDiff[paper.diff]] = true;
      });
    }
    function unlockDependents(id) {
      const t = topicById(id);
      graph[t.subject].filter(x => x.prereq.includes(id) && x.prereq.every(pid => getTopic(pid).lit)).forEach(next => {
        getTopic(next.id).easy = true;
      });
    }
    function addMistake(q) {
      const key = q.topicId + "-" + q.prompt;
      const old = state.mistakes.find(m => m.key === key);
      if (old) { old.count++; old.date = today(); old.tag = classify(q); }
      else state.mistakes.push({ key, subject: q.subject, topicId: q.topicId, topic: q.topic, prompt: q.prompt, answer: q.answer, explain: q.explain, type: q.type, tag: classify(q), count: 1, date: today() });
    }
    function classify(q) {
      if (q.subject === "鏁板" || q.subject === "鐗╃悊" || q.subject === "鍖栧") return "璁＄畻閿欒";
      if (q.type === "澶氶€?) return "瀹￠澶辫";
      return mistakeTags[Math.abs(hash(q.prompt)) % mistakeTags.length];
    }
    function showResult(score, pass) {
      const focusCount = paper.focusEvents?.length || 0;
      $("resultBox").innerHTML = `<div style="font-size:54px">${pass?"馃尭":"馃挆"}</div><h2>${pass?"閫氬叧鎴愬姛":"鏈鏈€氬叧"}</h2><p>寰楀垎锛?{score} / 100</p><p>涓撴敞璁板綍锛?{focusCount} 娆＄寮€/澶嶅埗/鍙抽敭绛夎涓?/p><p>${pass?"宸茶幏寰楁槦鏄熷苟瑙ｉ攣鏂板唴瀹广€?:"閫氬叧闇€瑕佹€诲垎鈮?0涓旈敊棰樺彉寮忓叏瀵癸紝閿欓宸茶繘鍏ラ敊棰樻湰銆?}</p><button class="btn primary" onclick="closeResult()">鐭ラ亾鍟?/button>`;
      $("resultModal").classList.add("show");
    }
    window.closeResult = () => $("resultModal").classList.remove("show");
    function renderMistakes() {
      const sub = $("mistakeSubject")?.value || "";
      const list = state.mistakes.filter(m => !sub || m.subject === sub).sort((a,b)=>b.count-a.count);
      $("mistakeList").innerHTML = list.map(m => `<div class="mistake-item"><div class="row"><span class="badge-pill">${m.subject}</span><span class="badge-pill">${m.topic}</span><span class="badge-pill">${m.tag}</span><span class="badge-pill">閿?{m.count}娆?/span></div><b>${m.prompt}</b><p>绛旀锛?{m.answer.join("銆?)}</p><p class="muted">${m.explain}</p><button class="btn mint" onclick="redoMistake('${m.key}')">閲嶅仛鍚岀被鍙樺紡</button></div>`).join("") || `<p class="muted">鏆傛棤閿欓銆?/p>`;
    }
    window.redoMistake = key => {
      const m = state.mistakes.find(x=>x.key===key);
      if (!m) return;
      selected = new Set([m.topicId]); $("difficulty").value = "easy"; buildPaper();
    };
    function renderMe() {
      const all = subjects.flatMap(s=>graph[s]);
      const lit = all.filter(t=>getTopic(t.id).lit).length;
      $("meStars").textContent = state.stars;
      $("meLit").textContent = lit;
      $("meRate").textContent = Math.round(lit / all.length * 100) + "%";
      $("checkinText").textContent = state.checkins.includes(today()) ? "浠婂ぉ宸茬鍒? : "浠婂ぉ杩樻湭绛惧埌";
      $("medals").innerHTML = medalDefs.map(([n,need]) => `<div class="medal"><b>${state.stars>=need?"馃弲":"馃敀"} ${n}</b><p class="muted">${need}鏄熻В閿?/p></div>`).join("");
      $("skins").innerHTML = skinDefs.map(([n,v],i) => `<button class="skin" ${state.stars<15 && i>0?"disabled":""} onclick="setSkin('${v}')"><b>${state.settings.visual===v?"鉁?:"馃巰"} ${n}</b><p class="muted">${i===0?"榛樿鍙敤":"15鏄熻В閿?}</p></button>`).join("");
      $("fontSize").value = state.settings.font; $("lineHeight").value = state.settings.line; $("visualMode").value = state.settings.visual; $("focusGuard").checked = state.settings.focusGuard !== false;
    }
    window.setSkin = v => { state.settings.visual = v; save(); renderMe(); applySettings(); };
    function applySettings() {
      document.body.classList.toggle("eye", state.settings.visual === "eye");
      document.body.classList.toggle("night", state.settings.visual === "night");
      document.body.classList.toggle("focus-guard", state.settings.focusGuard !== false);
      document.documentElement.style.setProperty("--fontScale", state.settings.font / 100);
      document.documentElement.style.setProperty("--lineScale", state.settings.line / 100);
    }
    function showTab(tab) {
      ["study","exam","mistakes","me"].forEach(x => {
        $(x+"View")?.classList.toggle("hidden", x !== tab);
        document.querySelector(`[data-tab="${x}"]`)?.classList.toggle("active", x === tab);
      });
      if (tab === "exam") renderQuestion();
      if (tab === "mistakes") renderMistakes();
      if (tab === "me") renderMe();
    }
    function getTopic(id) {
      state.unlocked[id] ||= { easy:false, medium:false, hard:false, lit:false };
      const topic = topicById(id);
      if (topic?.level === 1) state.unlocked[id].easy = true;
      return state.unlocked[id];
    }
    function isTopicOpen(t) {
      if (t.level === 1) return true;
      return t.prereq.every(id => getTopic(id).lit) || getTopic(t.id).easy;
    }
    function topicById(id) { return subjects.flatMap(s=>graph[s]).find(t=>t.id===id); }
    function difficultyStatus(st) { return st.lit ? "宸茬偣浜? : `绠€${st.easy?"鉁?:"路"} 涓?{st.medium?"鉁?:"路"} 闅?{st.hard?"鉁?:"路"}`; }
    function subjectProgress(s) { return Math.round(graph[s].filter(t=>getTopic(t.id).lit).length / graph[s].length * 100); }
    function icon(s) { return ({璇枃:"馃摉",鏁板:"馃敘",鑻辫:"馃敜",鐗╃悊:"馃挕",鍖栧:"鈿楋笍",鍘嗗彶:"馃彌锔?,閬撴硶:"鈿栵笍"})[s]; }
    function toast(t) { $("toast").textContent = t; $("toast").classList.add("show"); setTimeout(()=>$("toast").classList.remove("show"),2500); }
    function recordFocusEvent(type) {
      if (!paper || paper.result || state.settings.focusGuard === false) return;
      paper.focusEvents ||= [];
      paper.focusEvents.push({ type, at: Date.now(), q: qIndex + 1 });
      save();
      $("focusWarn").textContent = `涓撴敞璁板綍 ${paper.focusEvents.length}`;
      toast("宸茶褰曚竴娆＄寮€绛旈椤?澶嶅埗绛夎涓猴紝璇蜂笓蹇冨畬鎴愭湰鍗枫€?);
    }
    function enterFocusGuard() {
      if (state.settings.focusGuard === false) return;
      document.body.classList.add("focus-guard");
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
    }
    function exitFocusGuard() {
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    }
    function flower() { for(let i=0;i<10;i++){ const p=document.createElement("div"); p.className="petal"; p.textContent=i%2?"馃尭":"馃挅"; p.style.left=45+Math.random()*20+"vw"; p.style.top=55+Math.random()*15+"vh"; document.body.appendChild(p); setTimeout(()=>p.remove(),1000); } }
    function failPetal() { toast("閿欓宸茬粡鑷姩淇濆瓨锛屼笅涓€杞細寮哄埗娣峰叆鍙樺紡棰樸€?); }
    function hash(s) { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return h; }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => showTab(b.dataset.tab));
    $("closeGuideBtn").onclick = () => { $("guideModal").classList.remove("show"); state.first=false; save(); };
    $("guideBtn").onclick = () => $("guideModal").classList.add("show");
    if (!state.first) $("guideModal").classList.remove("show");
    $("selectUnlockedBtn").onclick = () => { graph[currentSubject].filter(isTopicOpen).forEach(t=>selected.add(t.id)); save(); renderAll(); };
    $("clearSelectedBtn").onclick = () => { selected.clear(); save(); renderAll(); };
    $("buildBtn").onclick = buildPaper;
    $("prevBtn").onclick = () => { if(paper) { qIndex=Math.max(0,qIndex-1); renderQuestion(); } };
    $("nextBtn").onclick = () => { if(paper) { qIndex=Math.min(paper.questions.length-1,qIndex+1); renderQuestion(); } };
    $("markBtn").onclick = () => { if(!paper)return; const q=paper.questions[qIndex]; paper.marks[q.uid]=!paper.marks[q.uid]; save(); renderQuestion(); };
    $("submitBtn").onclick = submitPaper;
    $("jumpMarkedBtn").onclick = () => { if(!paper)return; const i=paper.questions.findIndex(q=>paper.marks[q.uid]); if(i>=0){ qIndex=i; renderQuestion(); } else toast("鏆傛棤鏍囪棰樸€?); };
    $("mistakeSubject").onchange = renderMistakes;
    $("printMistakesBtn").onclick = () => window.print();
    $("clearMistakesBtn").onclick = () => { if(confirm("纭畾娓呯┖鍏ㄩ儴閿欓锛熸鎿嶄綔涓嶅彲鎾ら攢銆?) && confirm("璇峰啀娆＄‘璁わ細鐪熺殑娓呯┖閿欓鏈悧锛?)) { state.mistakes=[]; save(); renderAll(); } };
    $("checkinBtn").onclick = () => { if(!state.checkins.includes(today())) { state.checkins.push(today()); state.stars++; save(); renderAll(); flower(); } else toast("浠婂ぉ宸茬粡绛惧埌鍟︺€?); };
    $("fontSize").oninput = e => { state.settings.font = Number(e.target.value); save(); applySettings(); };
    $("lineHeight").oninput = e => { state.settings.line = Number(e.target.value); save(); applySettings(); };
    $("visualMode").onchange = e => { state.settings.visual = e.target.value; save(); applySettings(); };
    $("focusGuard").onchange = e => { state.settings.focusGuard = e.target.checked; save(); applySettings(); toast(e.target.checked ? "涓撴敞闃叉煡妯″紡宸插紑鍚€? : "涓撴敞闃叉煡妯″紡宸插叧闂€?); };
    $("exportBtn").onclick = () => { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"})); a.download="鑺辨季涓€冨埛棰樻暟鎹?json"; a.click(); URL.revokeObjectURL(a.href); };
    $("importBtn").onclick = () => $("importFile").click();
    $("importFile").onchange = e => { const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ state={...defaults(),...JSON.parse(r.result)}; save(); renderAll(); toast("瀵煎叆鎴愬姛銆?); }catch{ toast("瀵煎叆澶辫触銆?); } }; r.readAsText(f); };
    $("resetBtn").onclick = () => { if(confirm("纭畾閲嶇疆鍏ㄩ儴杩涘害锛?) && confirm("浜屾纭锛氭槦鏄熴€侀敊棰樸€佺鎶€鏍戦兘浼氭竻绌恒€?)) { state=defaults(); selected=new Set(); paper=null; qIndex=0; save(); renderAll(); showTab("study"); } };
    document.addEventListener("keydown", e => {
      if ($("examView").classList.contains("hidden") || !paper) return;
      const q = paper.questions[qIndex];
      if (/^[1-9]$/.test(e.key)) document.querySelectorAll("input[name='opt']")[Number(e.key)-1]?.click();
      if (/^[a-zA-Z]$/.test(e.key)) document.querySelectorAll("input[name='opt']")[e.key.toUpperCase().charCodeAt(0)-65]?.click();
      if (e.key === "ArrowRight") $("nextBtn").click();
      if (e.key === "ArrowLeft") $("prevBtn").click();
      if (e.key.toLowerCase() === "m") $("markBtn").click();
      if (e.key === "Enter") $("nextBtn").click();
    });
    document.addEventListener("visibilitychange", () => { if (document.hidden) recordFocusEvent("绂诲紑椤甸潰"); });
    window.addEventListener("blur", () => recordFocusEvent("鍒囨崲绐楀彛"));
    document.addEventListener("copy", e => { if (!$("examView").classList.contains("hidden") && state.settings.focusGuard !== false) { e.preventDefault(); recordFocusEvent("澶嶅埗棰樼洰"); } });
    document.addEventListener("cut", e => { if (!$("examView").classList.contains("hidden") && state.settings.focusGuard !== false) { e.preventDefault(); recordFocusEvent("鍓垏鍐呭"); } });
    document.addEventListener("contextmenu", e => { if (!$("examView").classList.contains("hidden") && state.settings.focusGuard !== false) { e.preventDefault(); recordFocusEvent("鍙抽敭鑿滃崟"); } });
    let touchX = 0;
    document.addEventListener("touchstart", e => touchX = e.changedTouches[0].clientX, {passive:true});
    document.addEventListener("touchend", e => {
      if ($("examView").classList.contains("hidden")) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (dx > 80) $("prevBtn").click();
      if (dx < -80) $("nextBtn").click();
    }, {passive:true});

    renderAll(); if (paper) startTimer();
  </script>
</body>
</html>
